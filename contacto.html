<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agujeros Negros</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

    <header>
        <nav>
            <ul>
                <li><a href="articulos.html">Inicio</a></li>
                <li><a href="index.html">Imagenes</a></li>
                <li><a href="interestellar.html">Interestellar</a></li>
                <li><a href="contacto.html" class="activa">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="formulario">
            <h2>Envia tu mensaje</h2>
            
            <form id="formulario-contacto">
                <div class="campo">
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre">
                </div>

                <div class="campo">
                    <label for="email">Correo:</label>
                    <input type="email" id="email" name="email">
                </div>

                <div class="campo">
                    <label for="telefono">Telefono:</label>
                    <input type="tel" id="telefono" name="telefono">
                </div>

                <button type="submit" id="boton-enviar">Enviar</button>
            </form>

            <div id="mensajes"></div>
        </section>
    </main>



    <script src="script.js"></script>

</body>
</html>
